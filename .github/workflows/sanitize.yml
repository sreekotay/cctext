name: sanitize

# Nightly and on demand: headless smokes under ASan and TSan.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ccc_ref:
        description: "concurrent-c git ref (empty = the pinned CCC_PIN)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # concurrent-c commit the tree is known to build with (ccc 0.4.0-420: #159 link commands, #160 target cap, #162 quiescent sysmon, per-script $TMPDIR staging).
  # Keep in step with smoke.yml, release-cctext.yml and docker/.
  CCC_PIN: 7c19121ed516b5f6d770dcc90b37b4a3d8fa2c9c

jobs:
  smoke_asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3

      - name: Install ccc
        env:
          CCC_REF: ${{ github.event.inputs.ccc_ref || env.CCC_PIN }}
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          git -C "$dest" checkout --detach "$CCC_REF"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ASAN smoke
        env:
          RTX_TARGETS: "256"
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_legend=0:fast_unwind_on_fatal=1
        run: ./make.shcc @smoke_asan

  smoke_tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3

      # Ubuntu 24.04 runners use 32 bits of mmap entropy; TSan's shadow
      # layout needs <= 28 ("unexpected memory mapping").
      - name: TSan mmap entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Install ccc
        env:
          CCC_REF: ${{ github.event.inputs.ccc_ref || env.CCC_PIN }}
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          git -C "$dest" checkout --detach "$CCC_REF"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # make.shcc adds scripts/tsan.supp (ccc runtime-internal reports only).
      - name: TSAN smoke
        env:
          RTX_TARGETS: "256"
        run: ./make.shcc @smoke_tsan

name: sanitize

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke_asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3

      - name: Install ccc
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: ASAN smoke
        env:
          RTX_TARGETS: "256"
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_legend=0
        run: ./make.shcc @smoke_asan

  smoke_tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3

      - name: Install ccc
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: TSAN smoke
        env:
          RTX_TARGETS: "256"
          TSAN_OPTIONS: halt_on_error=1
        run: ./make.shcc @smoke_tsan

name: release-cctext

on:
  push:
    tags: ["cctext-v*"]
  workflow_dispatch:
    inputs:
      ccc_ref:
        description: "concurrent-c git ref (empty = default branch)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            slug: macos-arm64
          - os: ubuntu-24.04
            slug: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential git

      - name: Install ccc
        env:
          CCC_REF: ${{ github.event.inputs.ccc_ref }}
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          if [ -n "${CCC_REF:-}" ]; then
            git -C "$dest" checkout "$CCC_REF"
          fi
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Dist cctext
        run: ./make.shcc @dist_cctext

      - uses: actions/upload-artifact@v4
        with:
          name: cctext-${{ matrix.slug }}
          path: dist/cctext-*.tar.gz
          if-no-files-found: error

  release:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/cctext-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tarballs" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

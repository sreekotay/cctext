name: release-cctext

on:
  push:
    tags: ["cctext-v*"]
  workflow_dispatch:
    inputs:
      ccc_ref:
        description: "concurrent-c git ref (empty = the pinned CCC_PIN)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # concurrent-c commit the tree is known to build with (ccc 0.4.0-419 + #159 link-command and #160 target-cap fixes).
  # Keep in step with smoke.yml, sanitize.yml and docker/.
  CCC_PIN: e59f6b9cf0a8dcb9cdef12604a9be4e038755678

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            slug: macos-arm64
          - os: ubuntu-24.04
            slug: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cctext-ui on Linux: libui-ng (meson + ninja) on GTK 3.
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential git pkg-config libgtk-3-dev meson ninja-build

      - name: Install ccc
        env:
          CCC_REF: ${{ github.event.inputs.ccc_ref || env.CCC_PIN }}
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          git -C "$dest" checkout --detach "$CCC_REF"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # cctext + cctext-ui (AppKit on macOS, GTK 3 on Linux) in one tarball.
      - name: Dist cctext
        run: ./make.shcc @dist_cctext

      - uses: actions/upload-artifact@v4
        with:
          name: cctext-${{ matrix.slug }}
          path: dist/cctext-*.tar.gz
          if-no-files-found: error

  release:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/cctext-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tarballs" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # concurrent-c commit the tree is known to build with (ccc 0.4.0-419).
  # Keep in step with sanitize.yml, release-cctext.yml and docker/.
  CCC_PIN: 0a633969f3065718bc4e1bfe3c8224851ae411d5

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git python3

      - name: Install ccc
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          git -C "$dest" checkout --detach "$CCC_PIN"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke
        run: ./make.shcc @smoke

      # Same smokes with dest-live kicks run on the caller
      # (RTX_PARALLEL_INLINE=1): the arm finishes before the next statement.
      - name: Smoke (inline kicks)
        run: ./make.shcc @smoke_inline

name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git

      - name: Install ccc
        run: |
          set -euo pipefail
          dest="$HOME/concurrent-c"
          git clone --filter=blob:none https://github.com/sreekotay/concurrent-c.git "$dest"
          PREFIX="$HOME/.local" "$dest/cc-install.sh" --no-editor-tools --no-add-to-path
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Smoke
        run: make smoke

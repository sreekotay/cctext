# cctext embed fixture: block scalars, multi-doc, anchors, flow mapping.
name: embeds
version: 1.2
install: |
  #!/bin/sh
  set -e
  echo "installing ${NAME:-embeds}"
  cat <<EOF
  heredoc inside a block scalar
  EOF
config: >
  {"key": "value",
   "list": [1, 2, 3],
   "nested": {"a": true, "b": null}}
notes: |
  # Markdown heading inside YAML

  Some *emphasis*, `code`, and a fence:

  ```python
  def f():
      """docstring"""
  ```
defaults: &defaults
  retries: 3
  timeout: 30
flow: {a: 1, b: "two", c: [3, 4]}
---
# second document
service:
  <<: *defaults
  name: "quoted: with colon"
  enabled: yes
---
# third document: a bare scalar
just a string

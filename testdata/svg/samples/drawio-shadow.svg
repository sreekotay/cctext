<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-written in draw.io's export shape: its "Shadow" option (the filter
     chain below, and the newer CSS drop-shadow() style), plus a blurred and a
     colour-matrixed shape. Our own content (testdata/svg/gen_samples.py). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="402px" height="232px" viewBox="-0.5 -0.5 402 232">
  <defs>
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="blur"/>
      <feOffset in="blur" dx="3" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#3D4574" flood-opacity="0.4" result="offsetColor"/>
      <feComposite in="offsetColor" in2="offsetBlur" operator="in" result="offsetBlur"/>
      <feBlend in="SourceGraphic" in2="offsetBlur"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="mono" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0.2"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <rect x="10" y="20" width="120" height="60" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all"/>
    <text x="70" y="54" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle">Request</text>
    <path d="M 130 50 L 183.63 50" fill="none" stroke="#000000" stroke-miterlimit="10" pointer-events="stroke"/>
    <path d="M 188.88 50 L 181.88 53.5 L 183.63 50 L 181.88 46.5 Z" fill="#000000" stroke="#000000" stroke-miterlimit="10" pointer-events="all"/>
    <ellipse cx="250" cy="50" rx="60" ry="30" fill="#d5e8d4" stroke="#82b366" pointer-events="all"/>
    <text x="250" y="54" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle">Validate</text>
  </g>
  <g style="filter: drop-shadow(rgba(0, 0, 0, 0.25) 2px 3px 2px);">
    <rect x="10" y="130" width="120" height="60" fill="#fff2cc" stroke="#d6b656" pointer-events="all"/>
    <text x="70" y="164" fill="#000000" font-family="Helvetica" font-size="12px" text-anchor="middle">Queue</text>
  </g>
  <circle cx="250" cy="160" r="30" fill="#f8cecc" stroke="#b85450" filter="url(#soft)"/>
  <g filter="url(#mono)">
    <rect x="320" y="120" width="70" height="80" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="330" y="130" width="50" height="20" fill="#ff8000"/>
  </g>
</svg>

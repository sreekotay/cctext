<?xml version="1.0" encoding="UTF-8"?>
<!-- Text the bundled faces are asked for: kerning pairs, real and synthetic
     bold / italic (Noto Serif and Noto Sans Mono have neither face), and CJK
     drawn by the per-glyph fallback inside Latin families. Our own content
     (testdata/svg/gen_samples.py). -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250">
  <rect width="420" height="250" fill="#ffffff"/>
  <g font-size="20" fill="#1a1a2e">
    <text x="12" y="30" font-family="Helvetica, sans-serif">AVATAR Toyota WAVE Ty. LT</text>
    <text x="12" y="62" font-family="Arial" font-weight="bold">Bold sans</text>
    <text x="170" y="62" font-family="Arial" font-style="italic">Italic sans</text>
    <text x="12" y="94" font-family="Georgia, serif">Serif</text>
    <text x="90" y="94" font-family="Georgia, serif" font-weight="bold">bold</text>
    <text x="160" y="94" font-family="Georgia, serif" font-style="italic">italic</text>
    <text x="235" y="94" font-family="Georgia, serif" font-weight="700" font-style="italic">both</text>
    <text x="12" y="126" font-family="Menlo, monospace">mono</text>
    <text x="80" y="126" font-family="Menlo, monospace" font-weight="bold">bold</text>
    <text x="150" y="126" font-family="Menlo, monospace" font-style="oblique">oblique</text>
    <text x="12" y="166" font-family="Helvetica">开始 Start → 処理する データ</text>
    <text x="12" y="200" font-family="Times New Roman" font-weight="bold">检查 输入 (bold serif + CJK)</text>
    <text x="12" y="234" font-family="Courier New" font-style="italic" font-size="16">言語 italic mono · 結束</text>
  </g>
</svg>

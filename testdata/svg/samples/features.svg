<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="200" viewBox="0 0 320 200">
  <!-- cctext SVG feature sampler (CC0): gradients, pattern, clip, mask,
       markers, opacity, transforms, the bundled faces, a data: image. -->
  <defs>
    <linearGradient id="lg" x1="0" x2="1">
      <stop offset="0" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#43a047" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="rg" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e53935"/>
    </radialGradient>
    <pattern id="pt" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#8e24aa"/>
      <rect x="4" y="4" width="4" height="4" fill="#8e24aa"/>
    </pattern>
    <clipPath id="cp"><circle cx="250" cy="45" r="32"/></clipPath>
    <mask id="mk"><rect x="10" y="110" width="90" height="70" fill="url(#lg)"/></mask>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="140" height="70" rx="10" fill="url(#lg)" stroke="#0d47a1" stroke-width="2"/>
  <circle cx="190" cy="45" r="32" fill="url(#rg)"/>
  <rect x="215" y="10" width="80" height="70" fill="url(#pt)" clip-path="url(#cp)"/>
  <rect x="10" y="110" width="90" height="70" fill="#fb8c00" mask="url(#mk)"/>
  <path d="M120 170 C150 100 190 190 230 120" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(250 150) rotate(20)" opacity="0.7">
    <rect x="-25" y="-18" width="50" height="36" fill="#00897b"/>
  </g>
  <text x="12" y="100" font-family="sans-serif" font-size="13">Sans <tspan font-weight="bold">Bold</tspan> <tspan font-style="italic">Italic</tspan></text>
  <text x="160" y="100" font-family="Georgia, serif" font-size="13">Serif</text>
  <text x="210" y="100" font-family="Menlo, monospace" font-size="13">mono()</text>
  <image x="270" y="160" width="24" height="24" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAE0lEQVR4nGP4z8AAQmDqP5D6DwBHygj4B2glbwAAAABJRU5ErkJggg=="/>
</svg>

<svg id="m1" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568.1 450" style="max-width: 568.1px;" role="graphics-document document" aria-roledescription="pie"><style>#m1{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m1 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m1 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m1 .error-icon{fill:#552222;}#m1 .error-text{fill:#552222;stroke:#552222;}#m1 .edge-thickness-normal{stroke-width:1px;}#m1 .edge-thickness-thick{stroke-width:3.5px;}#m1 .edge-pattern-solid{stroke-dasharray:0;}#m1 .edge-thickness-invisible{stroke-width:0;fill:none;}#m1 .edge-pattern-dashed{stroke-dasharray:3;}#m1 .edge-pattern-dotted{stroke-dasharray:2;}#m1 .marker{fill:#333333;stroke:#333333;}#m1 .marker.cross{stroke:#333333;}#m1 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#m1 p{margin:0;}#m1 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#m1 .pieCircle.highlighted{scale:1.05;opacity:1;}#m1 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#m1 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#m1 .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#m1 .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#m1 .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#m1 .node .neo-node{stroke:#9370DB;}#m1 [data-look="neo"].node rect,#m1 [data-look="neo"].cluster rect,#m1 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m1 [data-look="neo"].swimlane.cluster rect{filter:none;}#m1 [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#m1 [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m1 [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#m1 [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m1 [data-look="neo"].node circle .state-start{fill:#000000;}#m1 [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m1 [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m1 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,126.641,-134.859L0,0Z" fill="#ECECFF" class="pieCircle"/><path d="M126.641,-134.859A185,185,0,0,1,175.945,57.168L0,0Z" fill="#ffffde" class="pieCircle"/><path d="M175.945,57.168A185,185,0,1,1,-149.668,-108.74L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"/><path d="M-149.668,-108.74A185,185,0,0,1,0,-185L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"/><text transform="translate(51.077281684999086,-129.00648741699487)" style="text-anchor:middle;" class="slice">12%</text><text transform="translate(134.39091360659756,-34.505721844123585)" style="text-anchor:middle;" class="slice">18%</text><text transform="translate(-62.991181838862104,123.62715523113604)" style="text-anchor:middle;" class="slice">55%</text><text transform="translate(-62.99118183886213,-123.62715523113603)" style="text-anchor:middle;" class="slice">15%</text></g><text x="0" y="-200" class="pieTitleText">Where a render spends its time</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill:#ECECFF;stroke:#ECECFF;"/><text x="22" y="14">parse</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill:#ffffde;stroke:#ffffde;"/><text x="22" y="14">layout</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill:hsl(80, 100%, 56.2745098039%);stroke:hsl(80, 100%, 56.2745098039%);"/><text x="22" y="14">raster</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill:hsl(240, 100%, 86.2745098039%);stroke:hsl(240, 100%, 86.2745098039%);"/><text x="22" y="14">copy</text></g></g></svg>
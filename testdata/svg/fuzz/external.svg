<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="40">
  <!-- External references: the helper must never fetch these (and could
       not: no network, no file opens after lockdown). They render as
       missing; the rects around them still draw. -->
  <rect x="0" y="0" width="40" height="40" fill="#1565c0"/>
  <image x="0" y="0" width="40" height="40" href="file:///etc/passwd"/>
  <image x="40" y="0" width="40" height="40" xlink:href="http://127.0.0.1:9/pixel.png"/>
  <image x="80" y="0" width="40" height="40" href="../img/rgb.png"/>
  <use href="other.svg#shape"/>
  <style>@import url("http://127.0.0.1:9/style.css"); rect { stroke: black; }</style>
</svg>

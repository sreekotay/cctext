<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="90" viewBox="0 0 120 90">
  <filter id="s" x="-20%" y="-20%" width="150%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
    <feOffset in="b" dx="3" dy="2" result="o"/>
    <feFlood flood-color="#335" flood-opacity=".5"/>
    <feComposite in2="o" operator="in"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feColorMatrix type="hueRotate" values="90" result="h"/>
    <feComponentTransfer><feFuncR type="table" tableValues="0 1 0"/><feFuncA type="gamma" amplitude="1" exponent="2"/></feComponentTransfer>
    <feBlend in2="h" mode="multiply" x="0.1" width="0.8"/>
    <feComposite in2="SourceGraphic" operator="arithmetic" k1="0.5" k2="0.5" k3="0.2" k4="0"/>
    <feDropShadow dx="0.05" dy="0.05" stdDeviation="0.02" flood-color="red"/>
  </filter>
  <filter id="h" xlink:href="#s" x="0" width="1"/>
  <g filter="url(#s)"><rect x="10" y="10" width="40" height="30" rx="4" fill="#cde"/></g>
  <circle cx="80" cy="30" r="18" fill="orange" filter="url(#c)"/>
  <rect x="10" y="55" width="40" height="25" fill="teal" filter="url(#h)"/>
  <text x="60" y="75" font-size="12" filter="blur(1px) drop-shadow(1px 1px 1px #000) grayscale(50%) url(#c)">Fx</text>
</svg>
